<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koi Pond">
<meta name="theme-color" content="#0b1a14">
<meta name="description" content="An interactive koi pond with real water physics. Touch the water.">
<title>Koi Pond</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a14; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; transition: opacity .8s; }
  .ui.idle { opacity: .3; }
  .ui button { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    color: rgba(255, 255, 255, .85); background: rgba(10, 22, 16, .3); border: 1px solid rgba(255, 255, 255, .18);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); touch-action: manipulation; transition: transform .15s; }
  .ui button:active { transform: scale(.92); }
  .ui button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .ui svg { width: 18px; height: 18px; fill: currentColor; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 60px); text-align: center;
    color: rgba(255, 255, 255, .78); letter-spacing: .04em; pointer-events: none; transition: opacity 1.2s;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .4); }
  #hint.gone { opacity: 0; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: #cfe; }
</style>
</head>
<body>
<canvas id="pond" aria-label="Koi pond. Touch or drag on the water to make ripples."></canvas>
<div id="hint">Touch the water</div>
<div class="ui">
  <button id="feed" aria-label="Feed the koi">
    <svg viewBox="0 0 24 24"><circle cx="7" cy="9" r="2.6"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="12" cy="15" r="2.8"/><circle cx="18" cy="15.5" r="1.9"/></svg>
  </button>
  <button id="pause" aria-label="Pause" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path id="icon" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  </button>
</div>
<div id="err">This pond needs WebGL 2. Try the latest Safari or Chrome.</div>
<script type="module">
import { Pond } from './pond.js';
import * as U from './gl/util.js';
import { HEAD, NOISE, WORLD, LIGHT, WATERFN, VS_FULL, hdr } from './gl/common.js';
import { createEnv } from './gl/env.js';
import { createKoi } from './gl/koi.js';
import { createSurface } from './gl/surface.js';

const canvas = document.getElementById('pond');
const hint = document.getElementById('hint');
const params = new URLSearchParams(location.search);
const MAX_RATIO = 2;      // beyond 2x the extra pixels cost battery and nobody can see them
const EXPOSURE = 0.42;

// Per frame, underwater: the bed in dappled sun, caustics focused by the real ripples, shadows from above.
const FS_FLOOR = h => `${HEAD}${NOISE}${WORLD}${LIGHT}${WATERFN}${h}
uniform sampler2D u_floor;
in vec2 v_p;
layout(location = 0) out vec4 o;
layout(location = 1) out vec4 o_depth;
void main() {
  vec4 f = texture(u_floor, sv(v_p));
  float d = f.a * 1.6;
  vec3 w = waterD(v_p, 2.);
  float sun = canopy(v_p, d) * texture(u_sunvis, sv(v_p)).r;
  float focus = clamp(1. - w.z * 3., .6, 1.8);   // crests focus sunlight, troughs spread it
  vec3 E = SKY_E * skyOpen(v_p) + SUN_E * SUN.z * sun * caustics(v_p + w.xy * 40., d) * focus;
  o = vec4(enc(underwater(lin(f.rgb) * E, d, sun)), 1.);
  o_depth = vec4(f.a, 0, 0, 1);
}`;

// Per frame, the surface: refraction by real depth, the sky and canopy reflected, sun glitter, wind.
const FS_WATER = h => `${HEAD}${NOISE}${WORLD}${LIGHT}${WATERFN}${h}
uniform sampler2D u_scene, u_sdepth, u_env;
in vec2 v_p; out vec4 o;
// Gusts sweep over the pond as patches of fine ripples (cat's-paws); between them it lies glassy.
vec2 wind(vec2 p, out float rough) {
  vec2 dir = vec2(-.8, -.6), side = vec2(.6, -.8);   // blowing toward the bank
  vec2 q = vec2(dot(p, dir), dot(p, side));
  float t = u_time;
  vec2 gq = (q - vec2(t * 160., 0.)) * vec2(.004, .009);
  float gust = smoothstep(.58, .8, .7 * vnoise(gq) + .3 * vnoise(gq * 2.3 + 3.)) * smoothstep(.25, .6, vnoise(vec2(t * .06, 1.7)));
  vec2 rq = (q - vec2(t * 30., 0.)) * .17;
  float e = .6;
  vec2 c = vec2(vnoise(rq + vec2(e, 0)) - vnoise(rq - vec2(e, 0)), vnoise(rq + vec2(0, e)) - vnoise(rq - vec2(0, e)));
  rough = .025 + gust * .08;
  vec2 swell = vec2(.05, .021) * .2 * cos(dot(p, vec2(.05, .021)) - t * 1.9) + vec2(-.023, .061) * .12 * cos(dot(p, vec2(-.023, .061)) - t * 2.3);
  return (c.x * dir + c.y * side) * gust * .1 + swell * .5;
}
void main() {
  vec2 p = v_p;
  float rough;
  vec2 g = waterD(p, 1.).xy + wind(p, rough);
  vec3 n = normalize(vec3(-g, 1.));
  float dz = texture(u_sdepth, sv(p)).r * 1.6;
  vec3 under = dec(texture(u_scene, sv(p + g * dz * u_ppm * .25)).rgb);   // the view down shifts by ~1/4 slope x depth
  vec3 V = normalize(vec3((p - u_res * .5) / max(u_res.x, u_res.y) * .6, -1.));
  vec3 R = reflect(V, n);
  vec4 e = textureLod(u_env, .5 + .5 * R.xy / R.z, 1. + rough * 40.);   // a rough patch blurs what it mirrors
  vec3 sky = lin(e.rgb) * mix(.5, 4., e.a) * skyOpen(p);   // open sky is far brighter than the leaves against it
  float F = .02 + .98 * pow(1. - max(dot(-V, n), 0.), 5.);
  vec3 col = under * (1. - F) + sky * F;
  // sun glitter: the facets tipped halfway between the eye and the sun
  vec3 H = normalize(SUN - V);
  vec2 dev = n.xy / n.z - H.xy / H.z;
  col += SUN_E * 40. * F * exp(-dot(dev, dev) / (rough * rough)) * canopy(p, 0.);
  o = vec4(enc(col), 1.);
}`;

// To the screen: AgX tone mapping (hue-preserving highlights), a gentle punch, and film grain that also dithers.
const FS_POST = h => `${HEAD}${NOISE}${h}
uniform sampler2D u_frame;
uniform float u_exposure, u_time;
uniform vec2 u_res;
in vec2 v_p; out vec4 o;
vec3 agx(vec3 v) {
  const mat3 m = mat3(.842479062253094, .0423282422610123, .0423756549057051, .0784335999999992, .878468636469772,
    .0784336, .0792237451477643, .0791661274605434, .879142973793104);
  v = clamp(log2(m * max(v, 1e-10)), -12.47393, 4.026069);
  v = (v + 12.47393) / 16.499999;
  vec3 v2 = v * v, v4 = v2 * v2;
  return 15.5 * v4 * v2 - 40.14 * v4 * v + 31.96 * v4 - 6.868 * v2 * v + .4298 * v2 + .1191 * v - .00232;
}
vec3 agxOut(vec3 v) {
  const mat3 m = mat3(1.19687900512017, -.0528968517574562, -.0529716355144438, -.0980208811401368, 1.15190312990417,
    -.0980434501171241, -.0990297440797205, -.0989611768448433, 1.15107367264116);
  float l = dot(v, vec3(.2126, .7152, .0722));
  v = pow(max(v, 0.), vec3(1.3));
  return m * (l + 1.1 * (v - l));
}
void main() {
  vec3 c = agxOut(agx(dec(texture(u_frame, vec2(v_p.x / u_res.x, 1. - v_p.y / u_res.y)).rgb) * u_exposure));
  float l = dot(c, vec3(.2126, .7152, .0722));
  c += (hash(gl_FragCoord.xy + fract(u_time * 7.31) * 517.) - .5) * .03 * (1. - .7 * l);
  o = vec4(clamp(c, 0., 1.), 1.);
}`;

// ---------- GL ----------
let gl, R, quad;

function initGL() {
  const float = !params.has('ldr') && !!gl.getExtension('EXT_color_buffer_float');   // ?ldr tests the 8-bit fallback
  const h = hdr(float);
  quad = U.fullscreen(gl);
  R = {
    hdrFmt: float ? { internal: gl.RGBA16F, type: gl.HALF_FLOAT } : {},
    floor: U.program(gl, VS_FULL, FS_FLOOR(h)), water: U.program(gl, VS_FULL, FS_WATER(h)), post: U.program(gl, VS_FULL, FS_POST(h)),
    env: createEnv(gl, quad), koi: createKoi(gl, quad, h), surface: createSurface(gl, quad, h),
  };
  gl.disable(gl.DEPTH_TEST);
}

function pass(prog, values, texs) {
  gl.useProgram(prog.p);
  U.uniforms(gl, prog, values);
  U.textures(gl, prog, texs);
  quad();
}

// ---------- sizing ----------
let pond, cssW = 0, cssH = 0, quality = 1;

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const ratio = Math.min(devicePixelRatio || 1, MAX_RATIO) * quality;
  const bw = Math.round(w * ratio), bh = Math.round(h * ratio);
  let rebake = false;
  if (w !== cssW || h !== cssH) {
    cssW = w; cssH = h;
    if (pond) pond.resize(w, h);
    else {
      pond = new Pond(w, h, +params.get('seed') || (Math.random() * 1e9) | 0);
      if (params.has('debug')) window.pond = pond;
    }
    if (R.height) gl.deleteTexture(R.height);
    R.height = U.texture(gl, pond.water.w + 2, pond.water.h + 2, { internal: gl.R16F, format: gl.RED, type: gl.FLOAT });
    rebake = true;
  }
  if (canvas.width !== bw || canvas.height !== bh || !R.scene) {
    canvas.width = bw; canvas.height = bh;
    for (const k of ['scene', 'frame', 'sunvis']) U.release(gl, R[k]);
    R.scene = U.target(gl, bw, bh, R.hdrFmt, {});
    R.frame = U.target(gl, bw, bh, R.hdrFmt);
    R.sunvis = U.target(gl, Math.ceil(bw / 2), Math.ceil(bh / 2));
    rebake = true;
  }
  if (rebake) R.env.bake(pond, bw, bh);
}

// ---------- frame ----------
function render() {
  const { water, cell } = pond;
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, R.height);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, water.w + 2, water.h + 2, gl.RED, gl.FLOAT, water.height);
  const hw = water.w + 2, hh = water.h + 2;
  const world = {
    u_res: [cssW, cssH], u_time: pond.time, u_ppm: pond.ppm, ...pond.bankUniforms(),
    u_hmap: [1 / (cell * hw), 1 / (cell * hh), 1 / hw, 1 / hh], u_htexel: [1 / hw, 1 / hh], u_slope: 3.2,
  };
  const ctx = { world, tex: { dapple: R.env.dapple.tex, sunvis: R.sunvis.tex, floor: R.env.floor.tex } };

  // 1. what the bed sees of the sun: shadows of the bank, floating things and fish
  U.bindTarget(gl, R.sunvis);
  gl.clearColor(1, 1, 1, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA);
  R.surface.shadow(pond, ctx);
  R.koi.shadow(pond, ctx);

  // 2. underwater: the bed, then the fish (radiance, and the depth of whatever is seen)
  U.bindTarget(gl, R.scene);
  gl.disable(gl.BLEND);
  pass(R.floor, world, { u_floor: R.env.floor.tex, u_dapple: R.env.dapple.tex, u_sunvis: R.sunvis.tex, u_height: R.height });
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); // everything outputs premultiplied alpha
  R.koi.draw(pond, ctx);

  // 3. the surface: refraction, reflection, glitter
  U.bindTarget(gl, R.frame);
  gl.disable(gl.BLEND);
  pass(R.water, world, { u_scene: R.scene.texs[0], u_sdepth: R.scene.texs[1], u_env: R.env.env.tex, u_dapple: R.env.dapple.tex, u_height: R.height });

  // 4. things at and above the surface
  gl.enable(gl.BLEND);
  R.surface.draw(pond, ctx);

  // 5. to the screen
  U.bindTarget(gl, null, canvas.width, canvas.height);
  gl.disable(gl.BLEND);
  pass(R.post, { u_res: [cssW, cssH], u_time: pond.time, u_exposure: EXPOSURE }, { u_frame: R.frame.tex });
}

const pointers = new Map();
let raf = 0, last = 0, paused = false, ema = 16.7, slowFor = 0;

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  // adaptive resolution: if frames stay slow, render fewer pixels (never below 1 per CSS px)
  ema += (dt * 1000 - ema) * .05;
  const maxRatio = Math.min(devicePixelRatio || 1, MAX_RATIO);
  if (ema > 26 && maxRatio * quality > 1.01) {
    if ((slowFor += dt) > 2) { quality = Math.max(1 / maxRatio, quality * .8); slowFor = 0; ema = 16.7; resize(); }
  } else slowFor = 0;
  for (const p of pointers.values()) pond.hold(p.x, p.y, dt);
  pond.update(dt);
  render();
}

function start() { if (!raf && !paused && gl && !gl.isContextLost()) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }

// ---------- input ----------
const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
let hinted = false;
function dismissHint() { if (!hinted) { hinted = true; hint.classList.add('gone'); } }
// the controls step back while you watch the pond, and return at a touch
const ui = document.querySelector('.ui');
let idleTimer = 0;
function wake() { ui.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => ui.classList.add('idle'), 4000); }
document.addEventListener('pointerdown', wake, true);
wake();

canvas.addEventListener('pointerdown', e => {
  if (paused) return;
  canvas.setPointerCapture(e.pointerId);
  const [x, y] = pos(e);
  pointers.set(e.pointerId, { x, y });
  pond.touch(x, y);
  dismissHint();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const [x, y] = pos(e);
  pond.drag(p.x, p.y, x, y);
  p.x = x; p.y = y;
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(type, e => pointers.delete(e.pointerId));
for (const type of ['gesturestart', 'contextmenu', 'dblclick']) document.addEventListener(type, e => e.preventDefault());

const pauseBtn = document.getElementById('pause'), icon = document.getElementById('icon');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.setAttribute('aria-pressed', paused);
  pauseBtn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
  icon.setAttribute('d', paused ? 'M8 5l11 7-11 7z' : 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z');
  pointers.clear();
  paused ? stop() : start();
});
document.getElementById('feed').addEventListener('click', () => { pond.feed(); dismissHint(); if (paused) pauseBtn.click(); });
document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
new ResizeObserver(() => { if (gl && !gl.isContextLost()) { resize(); if (!raf) render(); } }).observe(canvas);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); stop(); });
canvas.addEventListener('webglcontextrestored', () => { initGL(); cssW = cssH = 0; resize(); start(); });
setTimeout(dismissHint, 7000);

gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
if (!gl) {
  document.getElementById('err').style.display = 'grid';
} else {
  initGL();
  resize();
  start();
}
</script>
</body>
</html>
